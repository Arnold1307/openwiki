image: node:22

pipelines:
  # Configure a scheduled pipeline in Repository settings > Pipelines > Schedules
  # that runs the "openwiki-update" custom pipeline below (e.g. daily).
  custom:
    openwiki-update:
      - step:
          name: Run OpenWiki update
          # Full history so `openwiki code --update` can diff HEAD against the
          # commit it last documented; Bitbucket's default shallow clone hides
          # that commit and the update runs against an empty change summary.
          clone:
            depth: full
          script:
            - apt-get update && apt-get install -y git curl
            # mermaid + jsdom are optional; they add high-fidelity validation of Mermaid diagrams. Remove if your wiki has none.
            - npm install --global openwiki mermaid@11.16.0 jsdom@29.1.1
            - git config user.name "${BITBUCKET_USER_NAME:-OpenWiki Bot}"
            - git config user.email "${BITBUCKET_USER_EMAIL:-openwiki@example.com}"
            - openwiki code --update --print
            - rm -f -- openwiki/.run.json
            - |
              PATHS_TO_CHECK="openwiki AGENTS.md"
              if [ -e CLAUDE.md ]; then PATHS_TO_CHECK="$PATHS_TO_CHECK CLAUDE.md"; fi
              if git diff --quiet -- $PATHS_TO_CHECK; then
                echo "OpenWiki is already up to date."
                exit 0
              fi
            - export OPENWIKI_BRANCH="openwiki/update"
            - git checkout -B "$OPENWIKI_BRANCH"
            - git add openwiki AGENTS.md
            - if [ -e CLAUDE.md ]; then git add CLAUDE.md; fi
            - git commit -m "docs: update OpenWiki"
            - git push --force "https://x-token-auth:${OPENWIKI_BITBUCKET_TOKEN}@bitbucket.org/${BITBUCKET_WORKSPACE}/${BITBUCKET_REPO_SLUG}.git" "$OPENWIKI_BRANCH"
            - |
              curl --fail --request POST \
                --url "https://api.bitbucket.org/2.0/repositories/${BITBUCKET_WORKSPACE}/${BITBUCKET_REPO_SLUG}/pullrequests" \
                --header "Authorization: Bearer ${OPENWIKI_BITBUCKET_TOKEN}" \
                --header "Content-Type: application/json" \
                --data "{\"title\":\"docs: update OpenWiki\",\"description\":\"Automated OpenWiki documentation update generated by the scheduled Bitbucket pipeline.\",\"source\":{\"branch\":{\"name\":\"${OPENWIKI_BRANCH}\"}},\"destination\":{\"branch\":{\"name\":\"${BITBUCKET_BRANCH}\"}}}" || true
          # TODO: Replace with your preferred inference provider and model
          # OPENWIKI_BITBUCKET_TOKEN must be a repository access token with
          # write access to repositories and pull requests.
          #
          # OpenWiki sends anonymous reliability telemetry from CI runs.
          # Set OPENWIKI_TELEMETRY_DISABLED: "1" in Repository Variables to disable.
          #
          # Pipeline schedule variables:
          #   OPENWIKI_PROVIDER: openrouter
          #   OPENROUTER_API_KEY: (secured variable)
          #   OPENWIKI_MODEL_ID: z-ai/glm-5.2
          #   OPENWIKI_BITBUCKET_TOKEN: (secured variable)
          #   LANGSMITH_API_KEY: (secured variable, optional)
          #   LANGCHAIN_PROJECT: openwiki
          #   LANGCHAIN_TRACING_V2: "true"
