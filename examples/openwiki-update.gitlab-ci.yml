openwiki_update:
  image: node:22
  stage: deploy
  rules:
    # Do not re-run on documentation update commits generated by OpenWiki
    - if: "$CI_COMMIT_MESSAGE =~ /^docs: update OpenWiki/"
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  before_script:
    - apt-get update && apt-get install -y git curl
    # mermaid + jsdom are optional; they add high-fidelity validation of Mermaid diagrams. Remove if your wiki has none.
    - npm install --global openwiki mermaid@11.16.0 jsdom@29.1.1
    - git config user.name "${GITLAB_USER_NAME:-OpenWiki Bot}"
    - git config user.email "${GITLAB_USER_EMAIL:-openwiki@example.com}"
  script:
    - openwiki code --update --print
    - rm -f -- openwiki/.run.json
    - |
      PATHS_TO_CHECK="openwiki AGENTS.md"
      if [ -e CLAUDE.md ]; then PATHS_TO_CHECK="$PATHS_TO_CHECK CLAUDE.md"; fi
      if git diff --quiet -- $PATHS_TO_CHECK; then
        echo "OpenWiki is already up to date."
        exit 0
      fi
    - export OPENWIKI_BRANCH="openwiki/update"
    - git checkout -B "$OPENWIKI_BRANCH"
    - git add openwiki AGENTS.md
    - if [ -e CLAUDE.md ]; then git add CLAUDE.md; fi
    - git commit -m "docs: update OpenWiki"
    - git push --force "https://oauth2:${OPENWIKI_GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "$OPENWIKI_BRANCH"
    - |
      EXISTING_MR=$(curl --silent --header "PRIVATE-TOKEN: ${OPENWIKI_GITLAB_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests?source_branch=${OPENWIKI_BRANCH}&target_branch=${CI_DEFAULT_BRANCH}&state=opened")
      if echo "$EXISTING_MR" | grep -q '"id":'; then
        echo "Existing open merge request updated via branch push."
      else
        curl --fail --request POST \
          --header "PRIVATE-TOKEN: ${OPENWIKI_GITLAB_TOKEN}" \
          --form "source_branch=${OPENWIKI_BRANCH}" \
          --form "target_branch=${CI_DEFAULT_BRANCH}" \
          --form "title=docs: update OpenWiki" \
          --form "description=Automated OpenWiki documentation update generated by the scheduled GitLab pipeline." \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests"
      fi
  variables:
    # Full history so `openwiki code --update` can diff HEAD against the commit
    # it last documented; GitLab's default shallow clone hides that commit and
    # the update runs against an empty change summary.
    GIT_DEPTH: "0"
    OPENWIKI_PROVIDER: openrouter
    OPENWIKI_MODEL_ID: z-ai/glm-5.2
    LANGCHAIN_PROJECT: openwiki
    LANGCHAIN_TRACING_V2: "true"
